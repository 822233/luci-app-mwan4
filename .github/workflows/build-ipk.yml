name: Build luci-app-mwan4 IPK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Makefile'
      - 'htdocs/**'
      - 'po/**'
      - 'root/**'
      - '.github/workflows/build-ipk.yml'

concurrency:
  group: build-luci-app-mwan4-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev file wget curl zstd

      - name: Validate Simplified Chinese translation
        run: msgfmt --check --check-format -o /dev/null po/zh_Hans/mwan4.po

      - name: Download ImmortalWrt 24.10 Filogic SDK
        run: |
          set -euo pipefail
          SDK_URL="https://downloads.immortalwrt.org/releases/24.10-SNAPSHOT/targets/mediatek/filogic/immortalwrt-sdk-24.10-SNAPSHOT-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          curl -fL "$SDK_URL" -o /tmp/immortalwrt-sdk.tar.zst
          mkdir -p /tmp/immortalwrt-sdk
          tar --zstd -xf /tmp/immortalwrt-sdk.tar.zst -C /tmp/immortalwrt-sdk --strip-components=1
          echo "SDK_DIR=/tmp/immortalwrt-sdk" >> "$GITHUB_ENV"

      - name: Prepare feeds and plugin
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          mkdir -p package/local/luci-app-mwan4
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='output' \
            "$GITHUB_WORKSPACE/" package/local/luci-app-mwan4/
          printf '\nsrc-link local %s/package/local\n' "$SDK_DIR" >> feeds.conf
          ./scripts/feeds update local
          ./scripts/feeds install -f -p local luci-app-mwan4
          make defconfig

      - name: Compile IPK
        shell: bash
        run: |
          set -euo pipefail
          cd "$SDK_DIR"
          git clone --depth 1 --branch openwrt-24.10 https://github.com/openwrt/luci.git /tmp/luci-source
          make -C /tmp/luci-source/modules/luci-base/src po2lmo
          install -D -m 0755 /tmp/luci-source/modules/luci-base/src/po2lmo staging_dir/host/bin/po2lmo
          test -x staging_dir/host/bin/po2lmo
          make package/feeds/local/luci-app-mwan4/compile V=s
          mkdir -p "$GITHUB_WORKSPACE/output"
          find bin/packages -type f \( -name 'luci-app-mwan4_*.ipk' -o -name 'luci-i18n-mwan4-zh-cn_*.ipk' \) -exec cp -v {} "$GITHUB_WORKSPACE/output/" \;
          test -n "$(find "$GITHUB_WORKSPACE/output" -type f -name 'luci-app-mwan4_*.ipk' -print -quit)"
          test -n "$(find "$GITHUB_WORKSPACE/output" -type f -name 'luci-i18n-mwan4-zh-cn_*.ipk' -print -quit)"

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-mwan4-immortalwrt-24.10-filogic
          path: output/*.ipk
          if-no-files-found: error
          retention-days: 14
